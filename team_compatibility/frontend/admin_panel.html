<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        nav {
            padding: 10px;
            background: #eee;
        }
        iframe {
            width: 100%;
            height: 90vh;
            border: none;
        }
    </style>
</head>
<body>
    <nav>
        <button onclick="loadPage('../frontend/admin_menu.html')">Menu</button>
        <button onclick="loadPage('../backend/admin_users.php')">Users</button>
        <button onclick="loadPage('../backend/list_project_roles.php')">Project Roles</button>
        <button onclick="loadPage('../backend/view_matches.php')">Matches</button>
        <button onclick="loadPage('../backend/view_assigned_roles.php')">Roles Assigned</button>
        <button onclick="loadPage('../backend/admin_posts.php')">Posts</button>
        <button onclick="loadPage('../frontend/admin_analytics.html')">Admin Analytics</button>

        <button onclick="window.location.href='../backend/logout.php'">Logout</button>
    </nav>

    <iframe id="content-frame" src="../frontend/admin_menu.html"></iframe>

    <script>
        function loadPage(url) {
            const timestamp = new Date().getTime();
	    document.getElementById('content-frame').src = `${url}?t=${timestamp}`;
        }
    </script>
</body>
</html>
